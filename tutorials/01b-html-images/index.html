<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>images</title>
</head>

<body>

    <section>
        <div>
            <img src="images/horse.jpg" alt="horse">
        </div>

        <div>
            <img src="images/horse.jpg" alt="horse">
        </div>
    </section>

    <section>
        <h2>Responsive images using srcset</h2>
        <img src="images/horse-fallback.jpg" width="800" alt="horse running" srcset="images/horse-640.jpg 640w,
 images/horse-1280.jpg 1280w,
 images/horse-1920.jpg 1920w">

    </section>


</body>

</html>
