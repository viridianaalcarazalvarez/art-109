<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>night</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #000;
            background-image: url('media/moon.gif');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            cursor: pointer;
        }

        #nightText {
            display: none;
            position: fixed;
            top: 6%;
            left: 6%;
            z-index: 1;
            max-width: 90vw;
            margin: 0;
            font-family: sans-serif;
            font-size: clamp(1.25rem, 4vw, 2.25rem);
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 18px #000, 0 0 36px #000, 0 2px 10px #000;
            pointer-events: none;
        }

        #nightText.visible {
            display: block;
            pointer-events: auto;
            cursor: pointer;
        }

        #nightText2 {
            display: none;
            position: fixed;
            right: 6%;
            bottom: 6%;
            top: auto;
            left: auto;
            z-index: 1;
            max-width: 90vw;
            margin: 0;
            font-family: sans-serif;
            font-size: clamp(1.1rem, 3.5vw, 2rem);
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 18px #000, 0 0 36px #000, 0 2px 10px #000;
            pointer-events: none;
        }

        #nightText2.visible {
            display: block;
            pointer-events: auto;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <p id="nightText">we share one moon</p>
    <p id="nightText2">goodnight...</p>

    <script>
        const nightText = document.getElementById('nightText');
        const nightText2 = document.getElementById('nightText2');

        document.body.addEventListener('click', function () {
            nightText.classList.add('visible');
        });

        nightText.addEventListener('click', function (e) {
            e.stopPropagation();
            if (nightText.classList.contains('visible')) {
                nightText2.classList.add('visible');
            }
        });

        nightText2.addEventListener('click', function (e) {
            e.stopPropagation();
            if (nightText2.classList.contains('visible')) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>

</html>
