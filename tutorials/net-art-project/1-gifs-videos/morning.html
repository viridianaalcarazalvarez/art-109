<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>morning</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f3f3;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            flex-direction: column;
        }

        body.nature-bg {
            background-image: url('media/nature.gif');
        }

        img {
            position: relative;
            z-index: 1;
            max-width: 80%;
            max-height: 70vh;
            cursor: pointer;
        }

         #text {
            display: none;
            position: relative;
            z-index: 1;
            margin-top: 20px;
            font-size: 1.5rem;
            color: #333;
            text-align: center;
            cursor: pointer;
            text-shadow: 0 0 6px #fff, 0 0 10px #fff;
        }

        #bgHit {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 0;
        }

         body.nature-bg #bgHit {
            display: block;
        }

        #birdsGif {
            display: none;
            position: fixed;
            top: 2%;
            left: auto;
            right: 6%;
            transform: none;
            z-index: 2;
            max-width: min(95vw, 900px);
            width: auto;
            height: auto;
            pointer-events: none;
        }

    #birdsGif.visible {
            display: block;
        }
        
    </style>
</head>

<body>
    <img src="media/coffee.gif" alt="coffee" id="coffeeGif">

    <div id="text">
        it's sunny...
    </div>

    <script>
        const gif = document.getElementById('coffeeGif');
        const text = document.getElementById('text');
        const bgHit = document.getElementById('bgHit');
        const birdsGif = document.getElementById('birdsGif');

        gif.addEventListener('click', function() {
            text.style.display = text.style.display === 'none' ? 'block' : 'none';
        });

        text.addEventListener('click', function() {
            document.body.classList.toggle('nature-bg');
            if (!document.body.classList.contains('nature-bg')) {
                birdsGif.classList.remove('visible');
            }
        });

        bgHit.addEventListener('click', function() {
            if (document.body.classList.contains('nature-bg')) {
                birdsGif.classList.add('visible');
            }
        });
        </script>
        
</body>

</html>
