<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day GIF</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3f3f3;
            flex-direction: column;
        }

        img {
            max-width: 80%;
            max-height: 70vh;
            cursor: pointer;
        }

        #text {
            display: none;
            margin-top: 20px;
            font-size: 1.5rem;
            color: #333;
            text-align: center;
        }

         #videoContainer {
            display: none; /* Initially hidden */
            margin-top: 30px;
            width: 80%;
            max-width: 800px;
            height: auto;
        }

        iframe {
            width: 100%;
            height: 450px;
        }
        
    </style>
</head>

<body>
    <img src="media/coffee.gif" alt="coffee" id="coffeeGif">

    <div id="text">
        it's sunny...
    </div>

    

    <script>
        const gif = document.getElementById('coffeeGif');
        const text = document.getElementById('text');
        const videoContainer = document.getElementById('videoContainer');

        gif.addEventListener('click', function() {
            text.style.display = text.style.display === 'none' ? 'block' : 'none';
        });

        text.addEventListener('click', function() {
            videoContainer.style.display = videoContainer.style.display === 'none' ? 'block' : 'none';
        });
    </script>
</body>

</html>
